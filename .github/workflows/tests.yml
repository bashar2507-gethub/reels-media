name: Tests

on:
  push:
    branches: [main]
    paths: ["app/**", "scripts/**", "tests/**", "requirements.txt"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - run: pip install -q -r requirements.txt
      - run: python -m pytest -q
