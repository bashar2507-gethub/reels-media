name: Render Reel

# Builds every queued Reel that has no result yet. Claude pushes queue/<id>.json; this job
# writes reels/<id>/ (video, cover, status.json) and commits it. Nothing is published here.
on:
  push:
    branches: [main]
    paths: ["queue/*.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        # FFmpeg still comes from Ubuntu's own signed packages. The time limits and the second mirror are here
        # because this step hung for 15 minutes on the runner's default mirror on 2026-11-11.
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffmpeg -version | head -1
            exit 0
          fi
          export DEBIAN_FRONTEND=noninteractive NEEDRESTART_SUSPEND=1
          sudo rm -f /var/lib/man-db/auto-update
          opts="-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::ForceIPv4=true -o DPkg::Lock::Timeout=60"
          attempt() {
            timeout -k 10 "$1" sudo -E apt-get $opts update -qq || echo "apt-get update did not finish cleanly; trying the install anyway"
            timeout -k 10 "$2" sudo -E apt-get $opts install -y -qq ffmpeg
          }
          attempt 45 120 && exit 0
          echo "Default mirror slow or unreachable; retrying with the main Ubuntu archive"
          timeout -k 10 60 sudo -E dpkg --configure -a || true
          printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          attempt 90 300

      - name: Install Python packages
        run: pip install -q -r requirements.txt

      - name: Render queued Reels
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          shopt -s nullglob
          for job in queue/*.json; do
            id="$(basename "$job" .json)"
            if [ -f "reels/$id/status.json" ]; then continue; fi
            echo "::group::$id"
            python scripts/render_job.py --reel-id "$id" || echo "$id did not pass; see reels/$id/status.json"
            echo "::endgroup::"
          done

      - name: Commit results
        run: |
          git config user.name "reels-render"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reels content
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "Render results"
          for attempt in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
